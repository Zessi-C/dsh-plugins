# eval-kernel: persistent interpreters for Python, R and JavaScript.
#
# One row is enough: the plugin registers a single `run_cell` tool and picks the
# interpreter per call from its `language` argument.
- insert:
    - id: eval-kernel
      name: 'dsh-eval-kernel'
      config:
        defaultLanguage: py
        timeoutMs: 300000
        maxOutputChars: 30000
        # Interpreters start under the session's own file-effect policy, so a
        # cell is confined exactly like the tool that asked for it. Set false
        # only to debug the kernel itself; it removes the confinement.
        sandbox: true
        # Reclaim a cell's memory (a loaded DataFrame, a fitted model) when its
        # language has gone unused this long.
        idleTimeoutMs: 1800000
